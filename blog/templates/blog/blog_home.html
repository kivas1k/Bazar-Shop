{% extends "base.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <div class="blog-posts">
    {% for post in posts %}
      <div class="post">
        <h2><a href="{% url 'blog_post' post.custom_id %}">{{ post.title }}</a></h2>
        {% if post.image %}
          <img src="{{ post.image.url }}" alt="{{ post.title }}">
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endblock %}

{% extends 'base.html' %}

{% load static %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <div class="container my-5">
    <h1 class="text-center my-5 display-4 text-uppercase">{{ post.title }}</h1>

    <div class="row g-4">
      {% if post.image %}
        <div class="col-lg-5 col-md-6 text-center">
          <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid rounded shadow-sm w-100">
        </div>
      {% endif %}

      <div class="{% if post.image %}col-lg-7 col-md-6{% else %}col-12{% endif %}">
        <div class="mb-4 p-3 bg-light rounded shadow-sm">
          <h3 class="text-muted">Содержание</h3>
          <p class="lead">{{ post.content }}</p>
        </div>

        {% if user.is_authenticated and user.is_superuser %}
          <div class="d-flex justify-content-between mt-4">
            <a href="{% url 'blog_edit' post.custom_id %}" class="btn btn-warning btn-lg rounded-pill">Редактировать</a>
            <a href="{% url 'blog_delete' post.custom_id %}" class="btn btn-danger btn-lg rounded-pill">Удалить</a>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
{% endblock %}

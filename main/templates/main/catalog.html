{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <ul>
        {% for product in products %}
            <li><a href="{% url 'product_detail' product.custom_id %}">{{ product.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}

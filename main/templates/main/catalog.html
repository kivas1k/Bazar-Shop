{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>
<ul>
    {% for category in categories %}
        <li><a href="{% url 'category_detail' cat_id=category.id %}">{{ category.name }}</a></li>
    {% empty %}
        <li>Категории пока отсутствуют.</li>
    {% endfor %}
</ul>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Редактирование товара{% endblock %}

{% block content %}
    <h1>Редактирование товара: {{ product.name }}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить изменения</button>
    </form>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Удалить категорию{% endblock %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>Вы уверены, что хотите удалить категорию "{{ category.name }}"?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'all_categories' %}" class="btn btn-secondary">Отменить</a>
  </form>
{% endblock %}

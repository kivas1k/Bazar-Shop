{% extends 'base.html' %}

{% block content %}
  <h2>Вход</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    {% if error %}
      <p style="color: red;">{{ error }}</p>
    {% endif %}
    <button type="submit">Войти</button>
  </form>
  <p>Еще нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
  <h2>Обновить аватар</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="avatar">Выберите новый аватар:</label>
    <input type="file" name="avatar" id="avatar" required>
    <button type="submit">Обновить аватар</button>
  </form>
  <a href="{% url 'profile' %}">Назад</a>
{% endblock %}
